<li class="card">
  <div class="card-top">
    <h2 class="card-title"><a href="/posts/{{ post.slug }}">#{{ post.title }}</a></h2>
    <span class="card-date">{{ post.date_label() }}</span>
  </div>
  <a href="/{{ post.category }}" class="badge-tag">{{ post.category }}</a>
  <p class="card-excerpt">{{ post.excerpt }}</p>
</li>
