{% extends "base.html" %}

{% block heading %}{% endblock %}

{% block extra_head %}
<script type="application/ld+json">{{ self.ld_json()|safe }}</script>
{% endblock %}

{% block content %}
<article class="post">
  <div class="post-meta">
    <span class="card-date">{{ post.date_label() }}</span>
  </div>
  <h1 class="post-title">#{{ post.title }}</h1>
  <div class="post-body">
    {{ post.html|safe }}
  </div>
</article>
{% endblock %}
