<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ self.page_title() }}</title>
  <meta name="description" content="{{ self.meta_description() }}">
  <link rel="canonical" href="{{ self.canonical_url() }}">
  <meta property="og:site_name" content="tinythought.">
  <meta property="og:title" content="{{ self.page_title() }}">
  <meta property="og:description" content="{{ self.meta_description() }}">
  <meta property="og:type" content="{{ self.og_type() }}">
  <meta property="og:url" content="{{ self.canonical_url() }}">
  <meta name="robots" content="{{ self.robots() }}">
  <link rel="stylesheet" href="/static/style.css">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <main class="container">
    <header class="site-header">
      <a class="wordmark" href="/">tinythought<span class="wordmark-period">.</span></a>
      <nav class="site-nav">
        {% for category in categories %}
        <a href="/{{ category.slug }}" {% if self.is_active(category.slug) %}class="active"{% endif %}>{{ category.title }}</a>
        {% endfor %}
        <a href="/admin" class="admin-link">admin</a>
      </nav>
    </header>

    {% block heading %}{% endblock %}

    {% block content %}{% endblock %}

    <footer class="site-footer">
      <p>Short posts. No noise.</p>
    </footer>
  </main>
</body>
</html>
