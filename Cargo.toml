[package]
name = "miniblog"
version = "0.1.0"
edition = "2024"
default-run = "miniblog"

[dependencies]
anyhow = "1.0.58"
axum = { version="0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "fs", "io-util", "sync"] }
tower-http = { version = "0.7", features = ["fs"] }
askama = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
pulldown-cmark = "0.13.4"
syntect = { version = "5.3", default-features = false, features = ["html"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
notify = "8.2.0"
dotenvy = "0.15.7"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "macros",
  "migrate",
  "chrono"
] }
async-trait = "0.1.92"
thiserror = "2"
argon2 = "0.5"
rand = "0.9"
rpassword = "7"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
png = "0.18"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
